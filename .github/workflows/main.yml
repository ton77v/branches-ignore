name: CI Flow

on:
  pull_request:
    branches-ignore:
      - 'mona/octocat'
      - 'releases/**-alpha'

jobs:
  check_lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@v6

      # Strict lockfile check — fails on drift. Tests the bumper's
      # ability to fix drift + re-trigger CI on the consistent state.
      - name: uv sync --locked
        run: uv sync --locked
