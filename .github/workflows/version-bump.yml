name: "Version bumper"
on:
  pull_request:
    branches:
      - master
      - main

jobs:
  bump-version:
    if: github.event.pull_request.merged == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # GH_PAT (not GITHUB_TOKEN) so the bot's push triggers a fresh
      # pull_request synchronize event and CI re-runs on the consistent
      # bumped state. GITHUB_TOKEN-pushed commits never trigger downstream
      # workflows by GitHub's anti-loop rule.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: "0"
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install UV
        uses: astral-sh/setup-uv@v6

      # Atomic: bump (if needed) + format + lock + single commit. No
      # [skip ci]: the push re-triggers CI on the consistent state.
      # Bumper's own re-run is a no-op (no diff -> no push -> terminates).
      - name: Bump + format + lock + commit (atomic)
        env:
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_BRANCH"

          NEW_VERSION=$(python - <<PY
          import tomllib, pathlib, subprocess

          def parse(v): return tuple(int(p) for p in v.split("."))

          head = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          base = tomllib.loads(subprocess.check_output(
              ["git", "show", "origin/${BASE_BRANCH}:pyproject.toml"], text=True
          ))["project"]["version"]

          if parse(head) > parse(base):
              print("")
          else:
              parts = head.split(".")
              parts[-1] = str(int(parts[-1]) + 1)
              print(".".join(parts))
          PY
          )

          if [ -n "$NEW_VERSION" ]; then
            CURRENT=$(grep -E '^version' pyproject.toml | head -1 | sed -E 's/version = "(.+)"/\1/')
            sed -i "s/^version = \"$CURRENT\"$/version = \"$NEW_VERSION\"/" pyproject.toml
            echo "Bumped: $CURRENT -> $NEW_VERSION"
          else
            echo "PR head version already ahead of base — no bump, fixing lockfile drift only"
          fi

          uv tool run taplo fmt pyproject.toml
          uv lock

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock

          if git diff --cached --quiet; then
            echo "No changes — bumper is a no-op this run"
            exit 0
          fi

          git commit -m "chore: bump version + sync lockfile"
          git push
